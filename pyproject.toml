[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kings-ops"
version = "0.1.0"
description = "Field service lakehouse platform library"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Deliberately NOT a runtime dependency: pyspark is provided by the Databricks
# runtime. Pinning it as a runtime dep is a classic way to shadow the cluster's
# own Spark with an incompatible local build.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
]
spark = [
    "pyspark>=3.5",
    "chispa>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "spark: requires a local SparkSession (skipped unless pyspark is installed)",
    "integration: runs against a live Databricks workspace",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src"]
